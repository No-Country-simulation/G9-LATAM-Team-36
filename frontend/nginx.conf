server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas de React (Historial, Simulador...) caen a index.html.
    # Sin esto, refrescar una ruta que no es "/" daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Puente al backend por la red interna de Docker.
    # El navegador llama a rutas relativas (mismo origen, puerto 80) y nginx
    # las reenvía al backend, sin exponer el 8080 ni necesitar CORS.
    location /analisis-energetico {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /analisis {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
