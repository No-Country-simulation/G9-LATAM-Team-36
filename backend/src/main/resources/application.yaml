spring:
  application:
    name: energiai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
tarifa:
  kwh: 0.75

# springdoc: comentado hasta que agreguemos la dependencia al pom.xml
# springdoc:
#   swagger-ui:
#     path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/energiai
    username: energiai
    password: change_me
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ml:
  service:
    url: http://localhost:8000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

ml:
  service:
    url: ${ML_SERVICE_URL}
