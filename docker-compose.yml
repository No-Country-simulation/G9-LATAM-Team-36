version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: energiai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energiai}
      POSTGRES_USER: ${POSTGRES_USER:-energiai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energiai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    container_name: energiai-ml-service
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: energiai-backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-energiai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-energiai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: energiai-frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
